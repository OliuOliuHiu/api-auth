services:
  api:
    build: .
    container_name: auth-api
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app/app
      - ./keys:/app/keys:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    depends_on:
      redis:
        condition: service_healthy

  api2:
    build: .
    container_name: auth-api-2
    ports:
      - "8002:8000"
    volumes:
      - ./app:/app/app
      - ./keys/public.pem:/app/keys/public.pem:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
